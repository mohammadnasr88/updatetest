<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود / ثبت‌نام</title>
<style>
    body {
        font-family: Tahoma, sans-serif;
        background: #f4f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .box {
        background: #fff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        width: 320px;
    }
    h2 { text-align: center; margin-bottom: 16px; }
    .tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
    .tab {
        flex: 1; text-align: center; padding: 8px; cursor: pointer; background: #f0f0f0;
    }
    .tab.active { background: #2563eb; color: #fff; }
    input {
        width: 100%;
        padding: 10px;
        margin-bottom: 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { color: #dc2626; text-align: center; margin-bottom: 10px; font-size: 14px; }
    .info { color: #6b7280; text-align: center; margin-bottom: 10px; font-size: 13px; }
    .success { color: #16a34a; text-align: center; }
</style>
</head>
<body>
    <div class="box">
        <h2 id="title">ورود به برنامه</h2>

        <div class="tabs">
            <div class="tab active" id="tabLogin">ورود</div>
            <div class="tab" id="tabSignup">ثبت‌نام</div>
        </div>

        <div class="error" id="errorBox" style="display:none"></div>
        <div class="info" id="infoBox" style="display:none"></div>

        <form id="authForm">
            <input type="email" id="email" placeholder="ایمیل" required>
            <input type="password" id="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" required minlength="6">
            <button type="submit" id="submitBtn">ورود</button>
        </form>
    </div>

    <!-- Firebase SDK (نسخه compat برای سادگی) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

    <script>
        // ⬇️⬇️ این بخش را با مقادیر Firebase خودتان جایگزین کنید ⬇️⬇️
        const firebaseConfig = {
            apiKey: "AIzaSyAdfhHJXH5Cv4p64SUb_LOs1BKfpZ8UcU0",
            authDomain: "jet-login-bfa19.firebaseapp.com",
            projectId: "jet-login-bfa19",
            storageBucket: "jet-login-bfa19.firebasestorage.app",
            messagingSenderId: "194460045152",
            appId: "1:194460045152:web:1745cee71527c3d068d805"
        };
        // ⬆️⬆️ ---------------------------------------------------- ⬆️⬆️

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const params = new URLSearchParams(window.location.search);
        const redirectUri = params.get('redirect_uri');
        const state = params.get('state');

        let mode = 'login'; // یا 'signup'

        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const title = document.getElementById('title');
        const submitBtn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');
        const infoBox = document.getElementById('infoBox');

        function setMode(newMode) {
            mode = newMode;
            errorBox.style.display = 'none';
            infoBox.style.display = 'none';
            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                title.textContent = 'ورود به برنامه';
                submitBtn.textContent = 'ورود';
            } else {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                title.textContent = 'ساخت حساب کاربری';
                submitBtn.textContent = 'ثبت‌نام';
            }
        }

        tabLogin.addEventListener('click', () => setMode('login'));
        tabSignup.addEventListener('click', () => setMode('signup'));

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            infoBox.style.display = 'none';
        }

        function translateFirebaseError(code) {
            const map = {
                'auth/email-already-in-use': 'این ایمیل قبلاً ثبت‌نام کرده است.',
                'auth/invalid-email': 'ایمیل نامعتبر است.',
                'auth/weak-password': 'رمز عبور باید حداقل ۶ کاراکتر باشد.',
                'auth/user-not-found': 'کاربری با این ایمیل یافت نشد.',
                'auth/wrong-password': 'رمز عبور اشتباه است.',
                'auth/invalid-credential': 'ایمیل یا رمز عبور اشتباه است.',
                'auth/too-many-requests': 'تعداد تلاش‌ها زیاد بوده، کمی صبر کنید.'
            };
            return map[code] || 'خطایی رخ داد. دوباره تلاش کنید.';
        }

        async function afterAuthSuccess(user) {
            if (!redirectUri) {
                infoBox.textContent = 'ورود موفق بود، اما آدرس بازگشت به برنامه یافت نشد.';
                infoBox.style.display = 'block';
                return;
            }

            const idToken = await user.getIdToken();

            const url = new URL(redirectUri);
            url.searchParams.set('token', idToken);
            url.searchParams.set('username', user.email);
            if (state) url.searchParams.set('state', state);

            window.location.href = url.toString();
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            infoBox.style.display = 'none';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                let userCredential;
                if (mode === 'login') {
                    userCredential = await auth.signInWithEmailAndPassword(email, password);
                } else {
                    userCredential = await auth.createUserWithEmailAndPassword(email, password);
                }
                await afterAuthSuccess(userCredential.user);
            } catch (err) {
                showError(translateFirebaseError(err.code));
            } finally {
                submitBtn.disabled = false;
            }
        });

        // اگر redirect_uri نبود، یعنی کاربر مستقیم صفحه را باز کرده (نه از داخل برنامه)
        if (!redirectUri) {
            infoBox.textContent = 'این صفحه باید از داخل برنامه‌ی دسکتاپ باز شود.';
            infoBox.style.display = 'block';
        }
    </script>
</body>
</html>
